<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco BBUA — Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300..800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app" id="inicio">


    <div class="principal">

      <!-- ===== ENCABEZADO ===== -->
      <header class="cielo">
        <div class="cielo-top">
          <div class="saludo">
            <span class="avatar" id="avatar"></span>
            <div>
              <span class="saludo-hola" id="saludo">Hola</span>
              <span class="saludo-nombre" id="nav-user"></span>
            </div>
          </div>
          <button id="btn-logout" class="salir">
            <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4" /></svg>Cerrar sesión
          </button>
        </div>

        <div class="cielo-fila">
          <div>
            <p class="saldo-etiqueta">Saldo disponible</p>
            <p id="display-balance" class="saldo">$0.00</p>
          </div>
          <div class="acciones">
            <button class="pastilla pastilla--marino" onclick="openModal('modal-transfer')">Transferir</button>
            <button class="pastilla" onclick="openModal('modal-deposit')">Depositar</button>
            <button class="pastilla" onclick="openModal('modal-withdraw')">Retirar</button>
          </div>
        </div>
      </header>

      <main class="tablero">

        <div class="columna">
          <!-- Alertas de fraude pendientes -->
          <section id="alertas" class="alertas"></section>

          <!-- ===== MOVIMIENTOS ===== -->
          <section class="seccion" id="seccion-movimientos">
            <h2 class="seccion-titulo">Movimientos</h2>
            <ul id="transaction-list" class="transaction-list">
              <li class="empty-state">Sin movimientos aún.</li>
            </ul>
          </section>
        </div>

        <div class="columna columna--lateral">
          <!-- ===== TARJETA ===== -->
          <section class="seccion" id="seccion-tarjeta">
            <h2 class="seccion-titulo">Mi tarjeta</h2>

            <div id="debit-card" class="debit-card">
              <div class="dc-arco" aria-hidden="true"></div>
              <div class="dc-top">
                <span class="dc-logo">VISA</span>
                <span class="dc-tipo">Débito · BBUA</span>
              </div>
              <p id="display-account" class="dc-number"></p>
              <div class="dc-bottom">
                <div>
                  <span class="dc-label">Titular</span>
                  <span id="nav-user-card" class="dc-value"></span>
                </div>
                <p id="display-extra" class="dc-extra"></p>
              </div>
              <button id="btn-toggle-visibility" class="dc-ojo" onclick="toggleVisibility()" title="Mostrar / ocultar datos" aria-label="Mostrar u ocultar datos de la tarjeta">
                <svg class="ojo-abierto" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
                <svg class="ojo-cerrado" viewBox="0 0 24 24"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.6 3.4M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.9 0 3.6-.6 5-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18" /></svg>
              </button>
              <button id="btn-lock" class="dc-candado" onclick="toggleLock()" title="Bloquear tarjeta" aria-label="Bloquear o desbloquear tarjeta">
                <svg class="candado-abierto" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 7.5-2" /></svg>
                <svg class="candado-cerrado" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
                <span id="lock-label" class="solo-lector">Bloquear</span>
              </button>
              <button id="btn-copiar" class="dc-copiar" onclick="copiarTarjeta()" title="Copiar datos de la tarjeta" aria-label="Copiar datos de la tarjeta">
                <svg class="copiar-icono" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h8" /></svg>
                <svg class="copiar-listo" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" /></svg>
              </button>
              <div class="dc-locked">
                <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
                Tarjeta bloqueada
              </div>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <!-- ===== ENVIAR DINERO ===== -->
  <div id="modal-transfer" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <button class="icono-btn icono-btn--claro" onclick="closeModal('modal-transfer')" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" /></svg>
        </button>
        <h3>Enviar dinero</h3>
        <span></span>
      </div>
      <label class="campo-envio">
        <span>Enviar a</span>
        <input type="text" id="transfer-dest" placeholder="Usuario, ej. ana" autocomplete="off" />
      </label>
      <div class="monto">
        <span class="monto-etiqueta">Monto</span>
        <div class="monto-valor"><span>$</span><input type="text" inputmode="decimal" id="transfer-amount" placeholder="0.00" autocomplete="off" /></div>
        <span class="monto-saldo">Saldo disponible <strong data-saldo></strong></span>
      </div>
      <div class="teclado" data-teclado="transfer-amount"></div>
      <p id="transfer-error" class="error-msg hidden"></p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('modal-transfer')">Cancelar</button>
        <button class="btn-primary deslizar" onclick="handleTransfer()">
          <span class="deslizar-perilla" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 7 5 5-5 5M13 7l5 5-5 5" /></svg></span>
          <span class="deslizar-texto">Desliza para enviar</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== DEPÓSITO ===== -->
  <div id="modal-deposit" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <button class="icono-btn icono-btn--claro" onclick="closeModal('modal-deposit')" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" /></svg>
        </button>
        <h3>Agregar dinero</h3>
        <span></span>
      </div>
      <div class="monto">
        <span class="monto-etiqueta">Monto</span>
        <div class="monto-valor"><span>$</span><input type="text" inputmode="decimal" id="deposit-amount" placeholder="0.00" autocomplete="off" /></div>
      </div>
      <div class="teclado" data-teclado="deposit-amount"></div>
      <p id="deposit-error" class="error-msg hidden"></p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('modal-deposit')">Cancelar</button>
        <button class="btn-primary" onclick="handleDeposit()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- ===== RETIRO ===== -->
  <div id="modal-withdraw" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <button class="icono-btn icono-btn--claro" onclick="closeModal('modal-withdraw')" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" /></svg>
        </button>
        <h3>Sacar dinero</h3>
        <span></span>
      </div>
      <div class="monto">
        <span class="monto-etiqueta">Monto</span>
        <div class="monto-valor"><span>$</span><input type="text" inputmode="decimal" id="withdraw-amount" placeholder="0.00" autocomplete="off" /></div>
        <span class="monto-saldo">Saldo disponible <strong data-saldo></strong></span>
      </div>
      <div class="teclado" data-teclado="withdraw-amount"></div>
      <p id="withdraw-error" class="error-msg hidden"></p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('modal-withdraw')">Cancelar</button>
        <button class="btn-primary" onclick="handleWithdraw()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Toast de notificación -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
