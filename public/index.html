<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco BBUA</title>
  <link rel="stylesheet" href="banco/styles.css" />
  <style>
    .inicio { max-width: 520px; margin: 0 auto; padding: 3rem 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .inicio h1 { color: var(--accent); font-size: 1.6rem; }
    .inicio p { color: var(--muted); line-height: 1.5; }
    .inicio a.card { display: block; text-decoration: none; color: var(--text); transition: border-color .2s; }
    .inicio a.card:hover { border-color: var(--primary); }
    .inicio a.card strong { display: block; font-size: 1.1rem; margin-bottom: .3rem; }
    .inicio code { color: var(--accent); }
  </style>
</head>
<body>
  <main class="inicio">
    <h1>Bienvenido</h1>
    <a class="card" href="banco/login.html"><strong>Banco BBUA</strong><span class="tx-date">Consulta tu saldo, tus movimientos y protege tu tarjeta.</span></a>
    <a class="card" href="tienda/"><strong>Amason</strong><span class="tx-date">Tienda en línea.</span></a>
  </main>
</body>
</html>
