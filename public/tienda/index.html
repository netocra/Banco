<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amason — Tienda en línea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..700&display=swap" />
  <link rel="stylesheet" href="tienda.css" />
</head>
<body>

  <div class="app">

    <!-- ===== BARRA LATERAL ===== -->
    <aside class="lateral">
      <a class="logo" href="./" aria-label="Amason">
        <span class="logo-text">Amason</span>
      </a>

      <nav class="lateral-grupo">
        <label class="lateral-buscar">
          <span>Buscar</span>
          <input id="buscar" type="search" placeholder="Buscar" aria-label="Buscar productos" autocomplete="off" />
        </label>
        <button class="lateral-link cart-btn" onclick="abrirCarrito()">
          Carrito <span id="cart-count" class="cart-count">0</span>
        </button>
      </nav>

      <nav class="lateral-grupo">
        <a class="lateral-link activo" href="./">Tienda</a>
        <a class="lateral-link" href="/banco/login.html">Banco BBUA</a>
      </nav>

      <p class="lateral-pie">© 2026 Amason<br />Pagos protegidos por Banco BBUA</p>
    </aside>

    <!-- ===== CONTENIDO ===== -->
    <div class="contenido">
      <header class="categorias" role="tablist" aria-label="Categorías">
        <div class="pestanas" id="pestanas"></div>
        <button class="orden" id="orden" onclick="cambiarOrden()">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M6 10h8M8 15h4" /></svg>
          <span id="orden-texto">Destacados</span>
          <span id="coleccion-cuenta" class="orden-cuenta">0</span>
        </button>
      </header>

      <main id="catalogo" class="mosaico" aria-live="polite"></main>
      <p id="sin-resultados" class="sin-resultados hidden">Sin piezas que coincidan.</p>
    </div>
  </div>

  <!-- ===== CARRITO ===== -->
  <div id="carrito" class="drawer-overlay hidden" onclick="if (event.target === this) cerrarCarrito()">
    <aside class="drawer">
      <div class="drawer-head">
        <h2>Carrito</h2>
        <button class="icon-btn" onclick="cerrarCarrito()" aria-label="Cerrar">✕</button>
      </div>
      <ul id="cart-items" class="cart-items"></ul>
      <div class="drawer-foot">
        <div class="total-row"><span>Total</span><strong id="cart-total">$0.00</strong></div>
        <button id="btn-checkout" class="btn" onclick="abrirPago()">Ir a pagar</button>
      </div>
    </aside>
  </div>

  <!-- ===== PAGO ===== -->
  <div id="pago" class="modal-overlay hidden" onclick="if (event.target === this) cerrarPago()">
    <form id="form-pago" class="modal" autocomplete="off">
      <h2>Pago con tarjeta</h2>
      <p class="muted">Total a pagar <strong id="pago-total"></strong></p>
      <button type="button" class="pegar" id="btn-pegar" onclick="pegarTarjeta()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="4" width="8" height="4" rx="1" /><path d="M16 6h2a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2" /></svg>
        Pegar datos de tarjeta
      </button>

      <label>Titular
        <input id="pago-titular" required placeholder="Como aparece en la tarjeta" />
      </label>
      <label>Número de tarjeta
        <input id="pago-numero" required inputmode="numeric" maxlength="23" placeholder="0000 0000 0000 0000" />
      </label>
      <div class="row">
        <label>Vencimiento
          <input id="pago-exp" required inputmode="numeric" maxlength="5" placeholder="MM/AA" />
        </label>
        <label>CVV
          <input id="pago-cvv" required inputmode="numeric" maxlength="4" placeholder="123" type="password" />
        </label>
      </div>

      <p id="pago-error" class="error hidden"></p>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="cerrarPago()">Cancelar</button>
        <button id="btn-pagar" type="submit" class="btn">Pagar</button>
      </div>
    </form>
  </div>

  <!-- ===== RESULTADO ===== -->
  <div id="resultado" class="modal-overlay hidden">
    <div class="modal center">
      <h2>Pago aprobado</h2>
      <p class="muted">Autorización <strong id="res-auth"></strong> · <span id="res-monto"></span></p>
      <button class="btn" onclick="document.getElementById('resultado').classList.add('hidden')">Seguir comprando</button>
    </div>
  </div>

  <script src="tienda.js"></script>
</body>
</html>
